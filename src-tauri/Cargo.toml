[package]
name = "efsspde"
version = "0.2.0"
description = "EFSS Pixel Discipline Editor"
authors = ["Ersen Filiz Saygıyla Sunar"]
edition = "2021"

[lib]
name = "efsspde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
