name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Operator Bridge runtime smoke test
        shell: bash
        run: |
          EFSS_EDITOR_TOKEN=ci-editor-token npm run bridge > /tmp/efsspde-bridge.log 2>&1 &
          BRIDGE_PID=$!

          cleanup() {
            kill "$BRIDGE_PID" 2>/dev/null || true
            cat /tmp/efsspde-bridge.log || true
          }
          trap cleanup EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              break
            fi
            sleep 0.5
          done

          curl -fsS http://127.0.0.1:8787/health
          EFSS_EDITOR_TOKEN=ci-editor-token npm run bridge:smoke
