name: Comfy Nodes CI

on:
  push:
    branches:
      - feat/comfy-node-pack-clean
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile node package
        run: python -m compileall -q .
